{% extends 'base.html' %}
{% block title %}File Too Large | Smart Lab{% endblock %}

{% block content %}
<section class="about form-page">
    <div class="container py-5 text-center">
        <div class="row">
            <div class="col-md-8 offset-md-2">
                <div class="servicecard1 p-5 my-4">
                    <span class="mainheading" style="font-size: 54px; color: #ffc107;"><i class="bi bi-exclamation-triangle"></i></span>
                    <h3 class="mt-3">File Size Limit Exceeded</h3>
                    <p class="text-muted mt-2">The file you uploaded is larger than the maximum allowed limit of 16 MB. Please compress the PDF or choose a smaller file.</p>
                    <div class="mt-4">
                        <a href="{{ url_for('main.upload_note') }}" class="btn aboutlearnmore2">Try Again</a>
                        <a href="{{ url_for('main.notes') }}" class="btn aboutlearnmore2 ms-2">View Notes</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
